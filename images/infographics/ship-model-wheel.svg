<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-labelledby="ttl desc">
  <title id="ttl">The SHIP model</title>
  <desc id="desc">The Sexual Health and Integrative Pleasure model, developed by Girard, Newstrom, Connor, Arenella, Vencill and Robinson (2023). An outer ring holds five philosophical foundations: systemic, bio psycho social cultural, across the lifespan, empiricism, and intersectionality. Five inner circles hold the core therapeutic components: sexual adaptation and resilience, relational intimacy, pleasure oriented positive sexuality, multidisciplinary care, and sexual literacy.</desc>
