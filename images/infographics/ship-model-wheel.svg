      .h1 { font-size: 58px; fill: #F5EFE3; text-anchor: middle; }
      .sub { font-size: 23px; fill: #A89580; font-style: italic; text-anchor: middle; }
      .ring { font-family: Lora, Georgia, serif; letter-spacing: 2.5px; }
      .complbl { font-family: Lora, Georgia, serif; font-size: 17px; letter-spacing: 0.6px; text-anchor: middle; }
      .def { font-family: Lora, Georgia, serif; font-size: 12.5px; fill: #E8DFD0; text-anchor: middle; }
      .citelbl { font-family: Lora, Georgia, serif; letter-spacing: 4px; font-size: 15px; fill: #B8945A; text-anchor: middle; }
      .cite { font-family: Lora, Georgia, serif; font-size: 17px; fill: #A89580; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#1F2C1F"/>
