  <text class="eyebrow" x="540" y="96">THE SHIP MODEL &#183; GIRARD ET AL. 2023</text>
  <text class="display h1" x="540" y="168">Not one broken thing.</text>
  <text class="body sub" x="540" y="212">Five things therapy works on, and the five lenses underneath</text>

