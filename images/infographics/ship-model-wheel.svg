  <text class="complbl" fill="#C9A579" x="343.09" y="1007.52">MULTIDISCIPLINARY</text>
  <text class="complbl" fill="#C9A579" x="343.09" y="1030.52">CARE</text>
  <text class="complbl" fill="#A89580" x="221.40" y="632.98">SEXUAL</text>
  <text class="complbl" fill="#A89580" x="221.40" y="655.98">LITERACY</text>

