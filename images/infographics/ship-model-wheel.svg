    <text class="ring" font-size="21" fill="#F5EFE3"><textPath href="#ring0" startOffset="50%" text-anchor="middle">SYSTEMIC</textPath></text>
  <text class="ring" font-size="19" fill="#1F2C1F"><textPath href="#ring1" startOffset="50%" text-anchor="middle">BIO, PSYCHO, SOCIAL, CULTURAL</textPath></text>
  <text class="ring" font-size="21" fill="#F5EFE3"><textPath href="#ring2" startOffset="50%" text-anchor="middle">ACROSS THE LIFESPAN</textPath></text>
  <text class="ring" font-size="21" fill="#1F2C1F"><textPath href="#ring3" startOffset="50%" text-anchor="middle">EMPIRICISM</textPath></text>
  <text class="ring" font-size="21" fill="#1F2C1F"><textPath href="#ring4" startOffset="50%" text-anchor="middle">INTERSECTIONALITY</textPath></text>

    <circle cx="540.00" cy="550.00" r="90" fill="#2D3E2C" stroke="#5D6B3F" stroke-width="2"/>
  <text class="def" x="540.00" y="540.00">Building and</text>
  <text class="def" x="540.00" y="554.00">keeping a flexible</text>
  <text class="def" x="540.00" y="568.00">sexual relationship.</text>
  <circle cx="722.60" cy="682.67" r="90" fill="#2D3E2C" stroke="#B8945A" stroke-width="2"/>
  <text class="def" x="722.60" y="658.67">Creating and</text>
  <text class="def" x="722.60" y="672.67">keeping intimacy</text>
  <text class="def" x="722.60" y="686.67">that allows</text>
  <text class="def" x="722.60" y="700.67">positive sexual</text>
  <text class="def" x="722.60" y="714.67">expression.</text>
  <circle cx="652.85" cy="897.33" r="90" fill="#2D3E2C" stroke="#C75D3D" stroke-width="2"/>
  <text class="def" x="652.85" y="873.33">A focus on</text>
  <text class="def" x="652.85" y="887.33">pleasure,</text>
  <text class="def" x="652.85" y="901.33">satisfaction and</text>
  <text class="def" x="652.85" y="915.33">consent, talked</text>
  <text class="def" x="652.85" y="929.33">about openly.</text>
  <circle cx="427.15" cy="897.33" r="90" fill="#2D3E2C" stroke="#C9A579" stroke-width="2"/>
  <text class="def" x="427.15" y="873.33">Care across the</text>
  <text class="def" x="427.15" y="887.33">physical, mental,</text>
  <text class="def" x="427.15" y="901.33">relational, social,</text>
  <text class="def" x="427.15" y="915.33">cultural and</text>
  <text class="def" x="427.15" y="929.33">spiritual.</text>
  <circle cx="357.40" cy="682.67" r="90" fill="#2D3E2C" stroke="#A89580" stroke-width="2"/>
  <text class="def" x="357.40" y="658.67">Getting accurate</text>
  <text class="def" x="357.40" y="672.67">sexual health</text>
  <text class="def" x="357.40" y="686.67">information and</text>
  <text class="def" x="357.40" y="700.67">folding it into</text>
  <text class="def" x="357.40" y="714.67">your own values.</text>
    <text class="complbl" fill="#5D6B3F" x="540.00" y="401.50">SEXUAL ADAPTATION</text>
